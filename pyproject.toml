[project]
name = "threadsdelete"
version = "0.1.0"
description = "Personal Threads cleanup tool using the official Meta Threads API"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["httpx>=0.28"]

[dependency-groups]
dev = ["mypy>=1.13", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.14"
strict = true
